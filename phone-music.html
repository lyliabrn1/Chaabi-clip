<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Algerian Chaabi Clip</title>
<style>
:root{box-sizing:border-box;--green:#006233;--dgreen:#023a20;--red:#d21034;--cream:#f6f1e4;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--green);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,Arial,sans-serif;color:#fff}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1a22 center/cover no-repeat}
#rig{transition:transform 2.6s cubic-bezier(.65,0,.2,1)}
#rig.zoom{transform:scale(1.9)}
#phone{position:relative;width:56vw;max-width:300px;aspect-ratio:9/19.5;border-radius:15% / 7%;background:linear-gradient(135deg,#bdb8ae,#7d7a73 45%,#a9a59b);padding:2.6%;box-shadow:0 25px 50px rgba(0,0,0,.45);animation:float 3.2s ease-in-out infinite}
#rig.zoom #phone{animation:none}
@keyframes float{50%{transform:translateY(-10px)}}
#phone::before,#phone::after{content:"";position:absolute;background:#8f8b82;border-radius:3px}
#phone::before{left:-1.6%;top:20%;width:1.6%;height:5%;box-shadow:0 55px 0 #8f8b82,0 110px 0 #8f8b82}
#phone::after{right:-1.6%;top:28%;width:1.6%;height:12%}
#screen{width:100%;height:100%;border-radius:12% / 5.6%;background:#000;padding:3px;overflow:hidden}
#ui{width:100%;height:100%;border-radius:11.5% / 5.3%;background:linear-gradient(180deg,#1f3d4c,#0a1a22);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5%;padding:0 9%}
#island{position:absolute;top:2.1%;left:50%;width:29%;height:3%;background:#000;border-radius:99px;transform:translateX(-50%)}
#cover{width:100%;aspect-ratio:1;border-radius:4%;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.45);transform:scale(.86);transition:transform .6s;background:#f6f1e4}
#cover.on{transform:scale(1)}
#cover svg,#cover img{display:block;width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.row{width:100%;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.t{min-width:0}
.t b{display:block;font-size:clamp(11px,3.6vw,18px);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span{display:block;font-size:clamp(9px,2.8vw,14px);opacity:.65;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.2em}
#eq{display:flex;align-items:flex-end;gap:2px;height:14px;width:16px;flex:none}
#eq i{flex:1;height:20%;background:#fff;border-radius:1px}
#eq.fake i{animation:bar .45s ease-in-out infinite alternate}
@keyframes bar{from{height:20%}to{height:100%}}
#prog{width:100%}
#prog div{height:4px;background:#ffffff40;border-radius:9px;overflow:hidden}
#prog u{display:block;height:100%;width:0;background:#fff}
#prog.fake u{animation:fill 40s linear forwards}
@keyframes fill{to{width:100%}}
#prog p{display:flex;justify-content:space-between;margin:4px 0 0;font-size:clamp(7px,2.2vw,11px);opacity:.6}
.ctl{display:flex;align-items:center;justify-content:space-between;width:70%}
.ctl svg{width:clamp(18px,6vw,30px);fill:#fff}
#play{position:relative;display:flex}
#play svg{width:clamp(26px,9vw,44px)}
#play .pa{display:none}#play.on .pl{display:none}#play.on .pa{display:block}
#touch{position:absolute;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.4);left:50%;top:50%;margin:-23px;transform:scale(1.8);opacity:0;pointer-events:none}
#touch.tap{animation:touch .6s ease-out}
@keyframes touch{0%{opacity:0;transform:scale(1.8)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
#go{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:#0a1a22ee;transition:opacity .4s;padding:20px}
#go.hide{opacity:0;pointer-events:none}
.card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.card h1{margin:0 0 4px;font-size:20px;text-align:center}
.card input[type=text]{font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid #ffffff55;background:#ffffff18;color:#fff;width:100%}
.card input::placeholder{color:#fff9}
.pick{display:block;text-align:center;padding:12px;border:1.5px dashed #ffffff88;border-radius:12px;font-size:15px}
.pick input{display:none}
.pick.ok{border-style:solid;background:#ffffff22}
button{font:inherit;color:#fff;background:#b08a3e;border:0;border-radius:99px;padding:14px 30px;font-size:18px;font-weight:600}
.hint{font-size:12px;opacity:.7;text-align:center;margin:0}
#re{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:10px;z-index:6;padding:8px 16px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .4s}
#re.show{opacity:.8;pointer-events:auto}
</style>
</head>
<body>
<div id="stage">
  <div id="rig"><div id="phone"><div id="screen"><div id="ui">
    <div id="island"></div>
    <div id="cover"><img id="defcover" alt=""></div>
    <div class="row"><div class="t"><b id="ttl">&nbsp;</b><span id="art">&nbsp;</span></div><div id="eq"><i></i><i></i><i></i><i></i></div></div>
    <div id="prog"><div><u id="bar"></u></div><p><span id="cur">0:00</span><span id="rem">&nbsp;</span></p></div>
    <div class="ctl">
      <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM9.5 12L20 6v12z"/></svg>
      <div id="play"><svg class="pl" viewBox="0 0 24 24"><path d="M7 4v16l13-8z"/></svg><svg class="pa" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg><span id="touch"></span></div>
      <svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 18V6l10.5 6z"/></svg>
    </div>
  </div></div></div></div>
</div>
<button id="re">Replay</button>
<div id="go"><div class="card">
  <h1>🎵 Chaabi Clip</h1>
  <label class="pick" id="pa">🎵 Choose song (optional)<input type="file" id="song"></label>
  <label class="pick" id="pc">🖼️ Choose cover image (optional)<input type="file" id="cov" accept="image/*"></label>
  <input type="text" id="itt" placeholder="Song title (optional)">
  <input type="text" id="iar" placeholder="Artist (optional)">
  <button id="start">Start</button>
  <p class="hint">No song chosen = silent. The song must be a file saved in the Files app (Apple Music downloads and streamed songs can’t be picked). Otherwise add your music in CapCut.</p>
</div></div>

  if(!$('#itt').value)$('#itt').value=f.name.replace(/\.[^.]+$/,'')}
  catch(err){buf=null;audio=null;L.firstChild.textContent='❌ Can’t read this file. Try an mp3 or m4a saved in Files '}};
$('#cov').onchange=e=>{const f=e.target.files[0];if(!f)return;$('#defcover').outerHTML='<img id="defcover" src="'+URL.createObjectURL(f)+'">';$('#pc').classList.add('ok');$('#pc').firstChild.textContent='✅ Cover added '};
function loop(){
  if(an){an.getByteFrequencyData(data);const n=bars.length;
    bars.forEach((b,i)=>{const v=data[2+i*3]/255;b.style.height=(20+v*80)+'%'});
    cover.style.transform='scale('+(1+(data[2]/255)*.025)+')'}
  if(audio&&audio.duration){$('#bar').style.width=(audio.currentTime/audio.duration*100)+'%';$('#cur').textContent=fmt(audio.currentTime);$('#rem').textContent='-'+fmt(audio.duration-audio.currentTime)}
  raf=requestAnimationFrame(loop)}
function reset(){T.forEach(clearTimeout);T=[];cancelAnimationFrame(raf);if(audio){audio.pause();audio.currentTime=0}
  rig.classList.remove('zoom');cover.classList.remove('on');cover.style.transform='';eq.classList.remove('fake');prog.classList.remove('fake');
  bars.forEach(b=>b.style.height='');$('#bar').style.width='0';$('#cur').textContent='0:00';
  play.classList.remove('on');touch.classList.remove('tap');re.classList.remove('show');void prog.offsetWidth}
function run(){
  reset();
  T.push(setTimeout(()=>rig.classList.add('zoom'),1800));
  T.push(setTimeout(()=>touch.classList.add('tap'),5000));
  T.push(setTimeout(()=>{play.classList.add('on');cover.classList.add('on');
    if(audio){audio.play();loop()}else{eq.classList.add('fake');prog.classList.add('fake')}},5250));
  T.push(setTimeout(()=>re.classList.add('show'),14000));
}
$('#start').onclick=()=>{
  $('#ttl').textContent=$('#itt').value.trim()||'\u00a0';$('#art').textContent=$('#iar').value.trim()||'\u00a0';
  if(audio)ensureAC();
  go.classList.add('hide');run()};
re.onclick=run;
</script>
</body>
</html>
